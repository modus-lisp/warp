<!doctype html>
<!--
  warp — the DOM encoding's client, over a local WebSocket.

  THE LOGIC IS NOT IN THIS FILE.  It is in client.js, which this page and the glass-webrtc phone
  client both load unmodified: a frame is a frame, and a client that behaved differently depending
  on whether the bytes came from a socket or an SCTP stream would be a second client to keep in
  step.  What lives here is the two things that ARE this page's: a stylesheet, and the fact that
  its transport is a WebSocket.
-->
<meta charset="utf-8">
<title>warp :: dom consumer</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0c0e12; color: #dce4ec;
         font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  header { padding: 10px 14px; border-bottom: 1px solid #1c2430; display: flex; gap: 18px;
           align-items: baseline; flex-wrap: wrap; }
  header b { font-weight: 600; letter-spacing: .04em; }
  header span { color: #8a949c; font-size: 12px; }
  #rows { list-style: none; margin: 0; padding: 0; }
  #rows li { display: flex; align-items: center; gap: 14px; padding: 8px 14px;
             background: #161a20; border-bottom: 1px solid #0c0e12; border-left: 4px solid #5abe82;
             cursor: default; }
  #rows li.selected { background: #26303c; }
  #rows li.warn { border-left-color: #fabe3c; }
  #rows li.bad  { border-left-color: #f04646; }
  #rows li .v { font-size: 15px; min-width: 170px; }
  #rows li .l { color: #8a949c; font-size: 12px; }
  #rows li .stale { margin-left: auto; color: #6a747c; font-size: 11px; }
  /* ---- the widget kinds beyond a plain row -------------------------------------------
     One rule per declared type, and the type is what selects them -- the client no longer
     infers a row's kind by reading its third cell.  A container is a part of a compound
     document (warp-quire) or a Miller column (warp-files); both are `.container'. */
  #rows .container { list-style: none; margin: 0; padding: 0; }
  #rows li.heading { border-left-color: transparent; background: transparent;
                     padding: 18px 14px 4px; }
  #rows li.heading .h { font-weight: 600; letter-spacing: .02em; }
  #rows li.heading.h1 .h { font-size: 22px; }
  #rows li.heading.h2 .h { font-size: 16px; color: #9fd8ff; }
  #rows li.heading.h3 .h { font-size: 14px; color: #8a949c; }
  #rows li.prose { border-left-color: transparent; background: transparent;
                   padding: 4px 14px 12px; display: block; }
  #rows li.prose .p { color: #b6c2cc; font: 13px/1.6 ui-sans-serif, system-ui, sans-serif;
                      max-width: 62ch; display: block; }
  /* A TABLE IS A ROW OF CELLS, so it needs no new node type -- only alignment.  The columns
     line up because every cell is a fixed-basis flex item, which is the cheapest thing that
     works without the server sending a width it has no business knowing (rule 2). */
  #rows li.trow { gap: 0; padding: 5px 14px; border-left-color: #2b6cb0; }
  #rows li.trow .td { flex: 1 1 0; text-align: right; font-variant-numeric: tabular-nums;
                      padding: 0 8px; }
  #rows li.trow .td.label, #rows li.trow .td.corner { flex: 1.6 1 0; text-align: left;
                                                      color: #dce4ec; }
  #rows li.trow .td.total { color: #9fd8ff; font-weight: 600; }
  #rows li.thead { border-left-color: #1c2430; background: #11151b; }
  #rows li.thead .td { color: #8a949c; font-size: 11px; text-transform: uppercase;
                       letter-spacing: .06em; }
  #rows li.ttotal { border-left-color: #5abe82; background: #11151b; }
  #rows li.ttotal .l { color: #8a949c; font-size: 12px; text-transform: uppercase; }
  /* min-width is reset, not inherited: the base .v rule reserves 170px for a monitor's value
     column, which here held the grand total 150px short of the right edge and out of line with
     the `total' column it belongs under. */
  #rows li.ttotal .v { margin-left: auto; min-width: 0; font-size: 15px; color: #5abe82;
                       font-variant-numeric: tabular-nums; text-align: right; }
  /* A ROW OF CHIPS IS A CONTAINER, not a row: each chip is its own presentation with its own
     key, so the strip is laid out by the container that holds them.  A container's place is
     the client's (§10.4) -- the server sends no geometry and did not have to learn a new
     delta kind for a horizontal list. */
  #rows .container[data-container^="crumbs:"] { display: flex; flex-wrap: wrap; gap: 8px;
      padding: 8px 14px; background: #14181e; border-left: 4px solid #fabe3c; }
  #rows .container[data-container^="crumbs:"] li.chip { background: #222c38; border: 0;
      border-radius: 12px; padding: 3px 12px; cursor: pointer; }
  #rows .container[data-container^="crumbs:"] li.chip.selected { background: #2b6cb0; }
  #rows li.chip .t { font-size: 12px; color: #dce4ec; }
  #menu { list-style: none; margin: 0; padding: 0; position: absolute; width: 240px;
          box-shadow: 0 8px 24px #0008; }
  #menu:empty { display: none; }
  #menu li { padding: 9px 12px; background: #222c38; border-left: 3px solid #dce4ec;
             border-bottom: 1px solid #0c0e12; display: flex; gap: 10px; cursor: pointer; }
  #menu li.destructive { background: #3a1c1c; border-left-color: #f04646; color: #ffb0b0; }
  #menu li .c { margin-left: auto; color: #8a949c; font-size: 10px; }
</style>

<header>
  <b>warp :: dom consumer</b>
  <span id="stat">connecting…</span>
  <span id="bytes"></span>
</header>
<ul id="rows"></ul>
<ul id="menu"></ul>

<script src="/client.js"></script>
<script>
"use strict";
const statEl = document.getElementById("stat");
const bytesEl = document.getElementById("bytes");
const ROWS = 14;                      // what this viewport can show; reported to the server

// The query string is passed through to the socket so the demo can seat a guest (?as=device)
// alongside an owner.  It can only ever NARROW what the server grants — see INVOKER-FOR.
const ws = new WebSocket("ws://" + location.host + "/warp" + location.search);

const client = makeWarpClient({
  rows: document.getElementById("rows"),
  menu: document.getElementById("menu"),
  viewportRows: ROWS,
  send: (o) => { if (ws.readyState === 1) ws.send(JSON.stringify(o)); },
  onStat: (s) => {
    statEl.textContent = `gen ${s.gen} · ${s.nodes} nodes · ${s.deltas} deltas`;
    bytesEl.textContent = `${s.frames} frames / ${s.bytes} B`;
  }
});
client.attachGestures(document);

ws.onopen = () => { statEl.textContent = "connected"; client.hello(ROWS, 0); };
ws.onclose = () => { statEl.textContent = "closed"; };
ws.onmessage = (ev) => client.apply(ev.data);

// The test harness drives these; a human uses the mouse.
window.warp = client;
</script>
